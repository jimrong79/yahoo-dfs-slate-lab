name: Refresh NBA slates and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: npm ci
      - run: pip install -r requirements.txt
      - name: Check optimizer and data adapters
        run: |
          npm test
          python -m pytest tests/test_pipeline.py -q
      - name: Recover previous snapshots
        run: python pipeline/restore_published.py
      - name: Discover current slates and refresh public inputs
        run: python pipeline/refresh.py
      - name: Build public site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          # Reruns retain earlier attempts' artifacts; select this attempt only.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
